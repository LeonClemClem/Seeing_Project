# Local development database. `make db-up`, then export
# DATABASE_URL=postgresql+psycopg://seeing:seeing@localhost:5432/seeing_dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seeing
      POSTGRES_PASSWORD: seeing
      POSTGRES_DB: seeing_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
