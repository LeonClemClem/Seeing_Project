[tool.poetry]
name = "seeing-api"
version = "0.1.0"
description = "FastAPI backend serving seeing forecasts and the built React SPA."
authors = ["defqoon <thomas.hossler@gmail.com>"]
packages = [{include = "seeing_api"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
seeing-db = {path = "../../packages/seeing_db", develop = true}
argon2-cffi = "^23.1"
email-validator = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[tool.poetry.scripts]
seeing-dev-seed = "seeing_api.dev_seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
