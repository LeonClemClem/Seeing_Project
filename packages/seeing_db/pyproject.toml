[tool.poetry]
name = "seeing-db"
version = "0.1.0"
description = "Database models and migrations shared by the seeing batch job and API."
authors = ["defqoon <thomas.hossler@gmail.com>"]
packages = [{include = "seeing_db"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
sqlalchemy = "^2.0"
psycopg = {extras = ["binary"], version = "^3.2"}
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
seeing-migrate = "seeing_db.migrate:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
