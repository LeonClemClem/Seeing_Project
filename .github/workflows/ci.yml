# Tests on every pull request; also called by deploy-prod.yml before deploying.
name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "1.8.3" # same as apps/api/Dockerfile

jobs:
  python:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # make targets; each starts its own throwaway Postgres container when it needs one.
        target: [test-api, test-core, test-batch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - if: matrix.target == 'test-api'
        run: make api-install
      - run: make ${{ matrix.target }}

  web:
    name: test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make web-install
      - run: make test-web
