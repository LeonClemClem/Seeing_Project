# Manual: Actions → "Deploy to dev" → Run workflow → pick a branch. Builds that branch and deploys
# web + batch to the private dev site (Google sign-in, project members only). Migrations run on the
# dev database, so only deploy branches whose database changes are ready to share.
name: Deploy to dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://seeing-web-dev-62naw3atjq-uc.a.run.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/5123733464/locations/global/workloadIdentityPools/github/providers/seeing-project
          service_account: seeing-deployer@project-astrarome.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy (migrations, web, batch)
        run: infra/scripts/deploy.sh dev all
